function hexHue(h){h=h.replace('#','');if(h.length==3)h=[...h].map(x=>x+x).join('');const[r,g,b]=[0,2,4].map(i=>parseInt(h.slice(i,i+2),16)/255),mx=Math.max(r,g,b),d=mx-Math.min(r,g,b);if(!d)return 30;let x=mx==r?((g-b)/d)%6:mx==g?(b-r)/d+2:(r-g)/d+4;return Math.round((x*60+360)%360)}
let sig='';
async function sync(){try{
 const tb=await getTabs(),key=JSON.stringify(tb);
 if(key===sig)return;
 if(tb.settings){const S={};tb.settings.slice(1).forEach(r=>S[norm(r[0])]=(r[1]||'').trim());

  if(S.whatsapp)SHOP.whatsapp=S.whatsapp.replace(/\D/g,'');if(S.phone)SHOP.phone=S.phone;if(S.currency)SHOP.cur=S.currency}
 if(tb.theme){const T2={};tb.theme.forEach(r=>{const k=norm(r[0]);if(k)T2[k]=r.slice(1).map(x=>(x||'').trim())});
  const KS=['bg','surface','text','muted','line','accent','accent_text'],M={bg:'--bg',surface:'--sf',text:'--fg',muted:'--mut',line:'--ln',accent:'--ac',accent_text:'--acf'},ok=x=>/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(x||'');
  const pn=norm((T2.selected_palette||[])[0]),pr=pn&&(tb.palettes||[]).find(r=>norm(r[0])==pn);
  const mk=i=>KS.map((k,j)=>{const t=T2[k]||[],c=[t[2+i],pr&&(pr[(i?8:1)+j]||'').trim(),t[i]].find(ok);return c?`${M[k]}:${c}`:''}).filter(Boolean).join(';');
  const lt=mk(0),dk=mk(1);let st=document.getElementById('theme');if(!st){st=document.createElement('style');st.id='theme';document.head.appendChild(st)}
  st.textContent=(lt?`:root{${lt}}`:'')+(dk?`@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){${dk}}}`:'');
  Object.keys(T2).filter(k=>k.startsWith('tint_')&&ok(T2[k][0])).forEach(k=>HUE[k.slice(5)]=hexHue(T2[k][0]))}
 const rows=tb.menu,h=rows[0].map(norm),ix=n=>h.indexOf(n);
 const items=rows.slice(1).filter(r=>r.some(x=>String(x).trim())&&yes(r[ix('show')])).map(r=>{const g=n=>ix(n)<0?'':String(r[ix(n)]||'').trim(),v=[];
  for(let k=1;k<=3;k++){const z=g('size_'+k),p=parseFloat(g('price_'+k));if(z&&p>=0)v.push([z,p])}

  return{c:norm(g('category'))||'menu',img:g('image_url'),k:lk[0],p:lk[1],t:g('tags').split(/[,;]/).map(norm).filter(Boolean).map(x=>x=='bestseller'?'best':x),
   n:{en,hi:g('name_hindi')||en,mr:g('name_marathi')||en},d:{en:de,hi:g('description_hindi')||de,mr:g('description_marathi')||de},v}});
 sig=key;state='';ITEMS=items;CATS=[...new Set(items.map(i=>i.c))];ui();render()}
 catch(e){console.warn('Sheet sync failed',e);dbg=String(e.message||e);if(state=='ld'){state='lf';render()}}}
if(LIVE||SOURCES.settings||SOURCES.theme){sync();setInterval(sync,Math.max(15,SOURCES.refreshSec)*1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()})}
